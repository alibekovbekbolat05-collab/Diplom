name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-model.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: python3 ml/parity.py
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-with-at-least-32-characters
